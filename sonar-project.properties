# SonarQube scan settings (run sonar-scanner from the repo root, or point a project at the downloaded zip)
sonar.projectKey=signage-automation-tool
sonar.projectName=Signage Automation Tool
sonar.sourceEncoding=UTF-8

sonar.sources=backend/app,backend/tools,frontend/src
sonar.tests=backend/tests,frontend/src
sonar.test.inclusions=backend/tests/**,frontend/src/**/*.test.mjs
sonar.exclusions=**/node_modules/**,**/dist/**,**/__pycache__/**,**/.venv/**,backend/brand_data/**,backend/data/**,presentations/**,**/*.pptx,**/*.cdr
sonar.coverage.exclusions=backend/tools/**,backend/tests/**,frontend/src/**/*.test.mjs,frontend/src/components/**,frontend/src/pages/**,frontend/src/context/**,frontend/src/hooks/**,frontend/src/editor/*.jsx,frontend/src/main.jsx,frontend/src/App.jsx

# Python: coverage is optional - create it with   cd backend && python -m pytest --cov=app --cov-report=xml:coverage.xml
sonar.python.version=3.10
sonar.python.coverage.reportPaths=backend/coverage.xml
sonar.javascript.lcov.reportPaths=frontend/lcov.info

# React Three Fiber props (position, args, intensity, ...) are not DOM attributes: S6747 is a known false positive on R3F JSX
sonar.issue.ignore.multicriteria=r3f
sonar.issue.ignore.multicriteria.r3f.ruleKey=javascript:S6747
sonar.issue.ignore.multicriteria.r3f.resourceKey=frontend/src/components/**
