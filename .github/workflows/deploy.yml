# Test and deploy: every push to `main` runs the tests on a GitHub-hosted Windows machine and, when they pass, updates the live
# site (https://sat.adinntechnologies.com) on the DigitalOcean droplet. Runs in GitHub's cloud, so this PC can be off.
#
# Secrets (repo Settings > Secrets and variables > Actions):
#   DEPLOY_SSH_KEY      private half of the "jenkins-deploy" key. On the droplet that key is locked with a forced command in
#                       /root/.ssh/authorized_keys: it can ONLY run `cd /opt/signage && sh deploy/deploy.sh`, nothing else.
#   DEPLOY_KNOWN_HOSTS  the droplet's host key line, so the runner refuses to talk to any other machine.
# Other branches and pull requests never deploy. Re-run by hand: Actions tab > "Test and deploy" > Run workflow.
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false      # never stop a deploy halfway; a newer push waits for the running one

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest      # the backend tests expect Windows (pywin32), like the Jenkins job
    timeout-minutes: 40
    env:
      SIGNAGE_ENGINE: mock        # never launch CorelDRAW in CI
      SIGNAGE_DATA: ${{ github.workspace }}\.ci-data
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Backend tests
        working-directory: backend
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m pytest -q -p no:cacheprovider
          python -m pytest -q -p no:cacheprovider ../agent/tests

      - name: Frontend tests and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm test
          npx vite build

  deploy:
    needs: test                  # only after every test passed
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy to the droplet
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          # the key's forced command runs deploy/deploy.sh: git pull, docker compose up -d --build, wait for /healthz
          ssh -T -i ~/.ssh/deploy_key -o BatchMode=yes -o StrictHostKeyChecking=yes root@142.93.219.72

      - name: Check the live site
        run: |
          for i in 1 2 3 4 5 6; do
            if curl -fsS https://sat.adinntechnologies.com/healthz; then echo; echo "Live site is up"; exit 0; fi
            sleep 10
          done
          echo "The live site did not answer /healthz" >&2
          exit 1
